specVersion: 1.3.0
description: Self Manifesto Census - tracking pledges verified through Self for manifesto campaigns
repository: https://github.com/vocdoni/davinci-manifesto
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: ManifestoCensus
    network: celo
    source:
      address: "0xa09DEad2Ab357824DfdeE1CF0A895B6b8BB57D81"
      abi: ManifestoCensus
      startBlock: 51510234
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Signer
        - CensusRoot
        - GlobalStats
        - PledgeEvent
        - Account
        - WeightChangeEvent
        - IdentityVerificationEvent
      abis:
        - name: ManifestoCensus
          file: ./abis/ManifestoCensus.json
      eventHandlers:
        - event: IdentityVerified(indexed address,uint256,bytes32)
          handler: handleIdentityVerified
        - event: Pledged(indexed address,uint256)
          handler: handlePledged
        - event: CensusRootUpdated(indexed uint256,uint256)
          handler: handleCensusRootUpdated
      file: ./src/mapping.ts
