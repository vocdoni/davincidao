specVersion: 1.3.0
description: Self Manifesto Census - tracking pledges verified through Self for manifesto campaigns
repository: https://github.com/vocdoni/davinci-manifesto
schema:
  file: ./schema.graphql
indexerHints:
  prune: auto
dataSources:
  - kind: ethereum/contract
    name: ManifestoCensus
    network: celo
    source:
      address: "0xA3e3d9570caEf34b8cbe5a206ff3bB3793985a61"
      abi: ManifestoCensus
      startBlock: 51479999
    mapping:
      kind: ethereum/events
      apiVersion: 0.0.9
      language: wasm/assemblyscript
      entities:
        - Signer
        - CensusRoot
        - GlobalStats
        - PledgeEvent
        - Account
        - WeightChangeEvent
      abis:
        - name: ManifestoCensus
          file: ./abis/ManifestoCensus.json
      eventHandlers:
        - event: Pledged(indexed address,uint256)
          handler: handlePledged
        - event: CensusRootUpdated(indexed uint256,uint256)
          handler: handleCensusRootUpdated
      file: ./src/mapping.ts
